services:
  # Isolated EDSDK process — Bun FFI can segfault on USB/IP; Docker restarts this service.
  canon-bridge:
    platform: linux/amd64
    build:
      context: .
      platforms:
        - linux/amd64
    init: false
    stop_signal: SIGTERM
    stop_grace_period: 3s
    entrypoint: ["/usr/bin/tini", "-s", "-g", "--", "/usr/local/bin/canon-bridge-entrypoint.sh"]
    environment:
      CANON_BRIDGE_PORT: 31337
      CANON_HOST_DISK_PATH: /app/output
      CANON_BRIDGE_SKIP_DISCONNECT_ON_EXIT: "1"
      CANON_USB_VID: "04a9"
      CANON_BRIDGE_EVENT_INTERVAL_MS: "20"
      BUN_BIN: /usr/local/bin/bun
    volumes:
      - ./output:/app/output
      - ./server:/app/server:ro
      - ./server/vendor:/app/server/vendor:ro
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/canon-bridge-health.sh"]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 20s

  photobooth:
    platform: linux/amd64
    build:
      context: .
      platforms:
        - linux/amd64
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      BUN_BIN: /usr/local/bin/bun
      CANON_HOST_DISK_PATH: /app/output
      NUXT_CAMERA_TYPE: canon
      NUXT_CAMERA_CANON_BRIDGE_URL: http://canon-bridge:31337
      NUXT_CAMERA_CANON_BRIDGE_AUTOSTART: "false"
      NTBA_FIX_350: "1"
    volumes:
      - ./output:/app/output
    depends_on:
      canon-bridge:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 8s
